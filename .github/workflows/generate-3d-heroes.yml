name: Generate 3D Hero Models

on:
  push:
    branches: [feature/3d-hero-models]
    paths:
      - 'tools/generate_hero_models.py'
      - '.github/workflows/generate-3d-heroes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install model generator dependencies
        run: python -m pip install trimesh numpy
      - name: Generate all 12 GLB models
        run: python tools/generate_hero_models.py
      - name: Validate generated GLB files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh
          root = Path('public/assets/characters3d')
          data = json.loads((root / 'manifest.json').read_text())
          assert len(data['models']) == 12
          for item in data['models']:
              path = root / item['file']
              assert path.is_file() and path.stat().st_size > 1000
              scene = trimesh.load(path, force='scene')
              assert len(scene.geometry) > 0
              print(item['id'], path.stat().st_size, 'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: magic-maze-adventure-3d-heroes
          path: public/assets/characters3d/
          if-no-files-found: error
          retention-days: 30
